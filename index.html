<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CropGuard — Greenhouse care</title><style>
:root{--ink:#19392c;--muted:#748477;--green:#287c51;--line:#e2e9df;--bg:#f7f9f5;--card:#fff;--yellow:#d2a02c;--orange:#e47d36;--red:#d64f49}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{min-height:100vh}.top{height:74px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1160px)/2))}.brand{font-size:21px;font-weight:800;letter-spacing:-.7px}.brand b{color:#35945e}.tiny{font-size:12px;color:var(--muted)}.shell{max-width:1160px;margin:0 auto;padding:32px 24px}.auth{max-width:490px;margin:60px auto}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 8px 40px #20482d08}.title{font-size:30px;letter-spacing:-1.3px;line-height:1.2;margin:6px 0 8px}.sub{color:var(--muted);margin:0 0 24px}.field{display:flex;flex-direction:column;gap:7px;margin:16px 0}.field label{font-size:13px;font-weight:700}input,select{width:100%;border:1px solid #dce5dc;border-radius:11px;padding:12px 13px;background:white;color:var(--ink);outline:none}input:focus,select:focus{border-color:#55a578;box-shadow:0 0 0 3px #55a57820}.btn{background:var(--green);color:white;border:0;border-radius:11px;padding:12px 18px;font-weight:700}.btn.secondary{background:#eef5ef;color:var(--ink)}.btn.outline{background:white;color:var(--ink);border:1px solid var(--line)}.btn.small{padding:8px 12px;font-size:13px}.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.stack{display:grid;gap:14px}.plans{display:grid;grid-template-columns:1fr 1fr;gap:18px}.plan{border:1px solid var(--line);background:#fff;border-radius:18px;padding:25px;text-align:left;transition:.2s}.plan:hover,.plan.selected{border-color:#459969;box-shadow:0 0 0 3px #45996915}.plan h2{margin:8px 0;font-size:23px}.plan{color:var(--ink)}.price-row{display:flex;align-items:baseline;gap:6px;margin:14px 0 3px}.price{display:inline-block;color:#153c29;font-size:44px;font-weight:850;line-height:1.12;letter-spacing:-1.7px}.price-period{font-size:16px;color:#5d7364;font-weight:600}.price-detail{font-size:12px;color:#6d806f}.plan ul{padding-left:18px;color:#607669;line-height:2}.tag{display:inline-flex;border-radius:100px;background:#edf5ef;color:#2b7650;padding:4px 10px;font-size:12px;font-weight:700}.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.unit{border:1px solid var(--line);border-radius:15px;padding:18px;background:white}.crop-picker{position:relative}.crop-list{position:absolute;top:100%;left:0;right:0;z-index:3;max-height:225px;overflow:auto;border:1px solid #cddfd0;border-radius:11px;margin-top:4px;background:#fff;box-shadow:0 12px 25px #183b291a}.crop-hint{font-size:12px;color:#738677;margin-top:6px}.crop-option:focus{background:#e6f3e9;outline:2px solid #5ba777;outline-offset:-2px}.crop-option{display:block;width:100%;text-align:left;background:white;border:0;border-bottom:1px solid #eef1eb;padding:10px 12px}.crop-option:hover{background:#eff7f0}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px}.sidebar{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;height:fit-content}.side-unit{width:100%;text-align:left;background:#fff;border:1px solid transparent;padding:12px;border-radius:12px;color:var(--ink);margin:5px 0}.side-unit.active{background:#edf6ef;border-color:#d7e8da}.side-unit strong{display:block}.content{min-width:0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:15px}.metric{border:1px solid var(--line);background:white;border-radius:15px;padding:21px}.metric .value{font-size:36px;font-weight:750;letter-spacing:-1px;margin:4px 0}.status{border-radius:15px;padding:19px 21px;border:1px solid;margin:18px 0}.status.green{background:#eff8f1;border-color:#cfe8d4;color:#237447}.status.yellow{background:#fff9e7;border-color:#f1dfa2;color:#92711a}.status.orange{background:#fff1e6;border-color:#f1c9a9;color:#a95c24}.status.red{background:#fff0ef;border-color:#f1c5c2;color:#aa3835}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:15px}.progress div{height:8px;background:#e8ede8;border-radius:10px}.progress div.on:nth-child(1){background:#3d9b68}.progress div.on:nth-child(2){background:#e2ba45}.progress div.on:nth-child(3){background:#e98b40}.progress div.on:nth-child(4){background:#d64f49}.notice{background:#f4f7f3;border:1px solid var(--line);border-radius:12px;padding:15px}.checkrow{display:flex;gap:10px;align-items:center;margin:10px 0}.checkrow input{width:auto}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 15px;border-radius:9px}.choice button.active{background:#eaf5ed;border-color:#4a986b}.history{font-size:13px;border-top:1px solid var(--line);padding:12px 0}.history strong{display:block}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(390px,100vw);background:white;border-left:1px solid var(--line);box-shadow:-15px 0 60px #12351e1b;padding:28px;z-index:5;overflow:auto}.overlay{position:fixed;inset:0;background:#16332055;z-index:4}.muted{color:var(--muted)}.mt{margin-top:20px}.divider{height:1px;background:var(--line);margin:20px 0}.pill{border-radius:99px;padding:4px 10px;background:#eaf2ec;font-size:12px}.smalltext{font-size:13px}.timeline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}.toast{position:fixed;bottom:24px;right:24px;background:#1d4732;color:white;padding:14px 18px;border-radius:12px;box-shadow:0 8px 25px #0002;z-index:8;max-width:350px}.hide{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{display:flex;gap:8px;overflow:auto}.side-unit{min-width:145px}.plans,.setup-grid{grid-template-columns:1fr}.shell{padding:20px 15px}.top{padding:0 18px}.metrics{gap:9px}.metric{padding:15px}.metric .value{font-size:30px}}

/* High-contrast, in-flow searchable crop catalog: never hidden behind adjacent cards */
.unit{min-width:0;overflow:visible}.crop-picker{position:relative;z-index:1}.crop-picker:focus-within{z-index:9}
.crop-search-wrap{position:relative}.crop-search-wrap:before{content:'⌕';position:absolute;left:13px;top:9px;font-size:25px;color:#246d49;pointer-events:none}
.crop-search-wrap input{padding-left:42px;border:2px solid #b6d3bd;background:#fbfefa;font-weight:600;color:#163c2b}
.crop-search-wrap input::placeholder{color:#5f7867;font-weight:400;opacity:1}
.crop-list{position:relative;top:auto;left:auto;right:auto;z-index:10;max-height:260px;overflow:auto;border:2px solid #8eb99b;border-radius:13px;margin-top:9px;background:#fff;box-shadow:0 12px 28px #143e2818}
.crop-list-head{padding:10px 14px;background:#e5f3e8;color:#1d5d3a;font-size:12px;font-weight:800;border-bottom:1px solid #b8d8c0}
.crop-option{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:#fff;color:#153d2b!important;border:0;border-bottom:1px solid #dce9de;padding:13px 15px;font-weight:750;font-size:15px;min-height:49px}
.crop-option:nth-child(even){background:#f7fbf7}.crop-option:hover,.crop-option:focus{background:#d8efdf!important;color:#103d27!important;outline:2px solid #438f5d;outline-offset:-2px}
.crop-category{font-size:11px;color:#35694c;background:#e6f2e9;padding:4px 9px;border-radius:30px;font-weight:650;white-space:nowrap}
.crop-selected{display:flex;align-items:center;gap:7px;margin-top:9px;color:#1f7449;font-size:12px;font-weight:700}
.sensor-panel{background:#fff;border:1px solid #d9e6dc;border-radius:18px;padding:21px;margin-top:22px}
.sensor-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:16px 0}
.sensor-item{border:1px solid #dfebe0;background:#fbfdfb;border-radius:12px;padding:11px;min-width:0}
.sensor-item strong{display:block;font-size:12px;line-height:1.3}.sensor-item .sensor-icon{font-size:18px;display:block;margin-bottom:5px}.sensor-item .sensor-kind{display:block;color:#7b887d;font-size:11px;margin-top:5px}
.sensor-item.active{background:#eef8f0;border-color:#a6d4b2}.sensor-item.active .sensor-kind{color:#24774a}
.sensor-connect{border-radius:12px;background:#f0f6f1;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sensor-connect strong{font-size:14px}.sensor-progress{height:7px;background:#d9e7dc;border-radius:99px;overflow:hidden;margin-top:9px;width:100%}.sensor-progress-fill{height:100%;background:#2e8757;transition:width .5s ease}
.sensor-note{font-size:12px;color:#687c6c;margin:10px 0 0}
.sensor-mini{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0 0}.sensor-mini span{font-size:12px;padding:8px;border:1px solid #e0eae1;background:#f8fbf8;border-radius:8px}
@media(max-width:800px){.sensor-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="app"><header class="top"><div class="brand">✳ <b>Crop</b>Guard</div><div class="row"><span class="tiny" id="topLabel">Smart greenhouse care</span><button class="btn secondary small hide" id="resetBtn" onclick="resetApp()">Start over</button></div></header><main class="shell" id="root"></main></div><div id="portal"></div><script>
const CROP_CATALOG=[
['Tomato','Vegetable'],['Cucumber','Vegetable'],['Lettuce','Leafy green'],['Bell Pepper','Vegetable'],['Strawberry','Fruit'],['Basil','Herb'],['Spinach','Leafy green'],['Eggplant','Vegetable'],['Zucchini','Vegetable'],['Rose','Flower'],['Petunia','Flower'],['Orchid','Flower'],['Mint','Herb'],['Kale','Leafy green'],['Blueberry','Fruit'],['Raspberry','Fruit'],['Melon','Fruit'],['Green Bean','Vegetable'],['Carrot','Root crop'],['Marigold','Flower'],['Chili Pepper','Vegetable'],['Cilantro','Herb'],['Parsley','Herb'],['Watermelon','Fruit'],['Cabbage','Leafy green'],['Broccoli','Vegetable'],['Geranium','Flower'],['Microgreens','Leafy green'],['Arugula','Leafy green'],['Pea','Vegetable']
];
const CROPS=CROP_CATALOG.map(x=>x[0]);
const SENSORS=[{icon:'🌡',name:'Air temperature',kind:'Used in risk alerts',active:true},{icon:'💧',name:'Relative humidity',kind:'Used in risk alerts',active:true},{icon:'◉',name:'CO₂',kind:'Optional channel',active:false},{icon:'☀',name:'Light / PAR',kind:'Optional channel',active:false},{icon:'🌱',name:'Substrate moisture',kind:'Optional channel',active:false},{icon:'⚡',name:'Substrate EC',kind:'Optional channel',active:false},{icon:'◈',name:'Substrate pH',kind:'Optional channel',active:false},{icon:'☔',name:'Leaf wetness',kind:'Optional channel',active:false}];
const state={page:'signup',phone:'',plan:'Pro',units:[{name:'Greenhouse 1',crop:''},{name:'Greenhouse 2',crop:''}],active:0,stage:0,run:false,phase:'rising',inspection:'',where:'Under leaves',checks:[],history:[],contacts:[],smsOpen:false,startedAt:0,notified:false,sensorLinked:false,sensorConnecting:false,sensorLinkStep:0,smsConsent:false,smsMode:'checking',smsStatus:'No SMS sent yet',demoSession:null};let ticker=null,toastTimer=null;
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages=[{t:72,h:66,name:'Optimal',color:'green',message:'Greenhouse conditions are in the configured monitoring range.',action:'No action needed. Continue routine monitoring.'},{t:73,h:78,name:'Watch',color:'yellow',message:'Humidity is rising toward the upper guidance range.',action:'Check ventilation and keep an eye on humidity.'},{t:73,h:84,name:'Caution',color:'orange',message:'Humidity is approaching a range that may support fungal growth.',action:'Check airflow, reduce condensation and inspect the crop.'},{t:73,h:92,name:'High disease risk',color:'red',message:'Prolonged high humidity can favor tomato leaf mold.',action:'Inspect older tomato leaves, especially the undersides.'}];
function toast(m){$('portal').innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(!state.smsOpen)$('portal').innerHTML=''},3500)}
function render(){if(state.page==='signup')renderSignup();if(state.page==='plans')renderPlans();if(state.page==='setup')renderSetup();if(state.page==='dashboard')renderDashboard();$('resetBtn').classList.toggle('hide',state.page==='signup');$('topLabel').textContent=state.page==='dashboard'?'Simulated sensor replay · Demo mode':'Smart greenhouse care'}
function renderSignup(){$('root').innerHTML=`<section class="panel auth"><span class="tag">WELCOME TO CROPGUARD</span><h1 class="title">A healthier greenhouse starts here.</h1><p class="sub">Monitor growing conditions, spot risks early and know what to check next.</p><div class="field"><label>Mobile number (demo only — use a sample)</label><input id="phone" type="tel" placeholder="+1 (555) 000-0000" value="${esc(state.phone)}"></div><div class="field"><label>Password</label><input type="password" placeholder="Create a password"></div><label class="checkrow smalltext"><input type="checkbox" id="smsConsent" ${state.smsConsent?'checked':''} onchange="state.smsConsent=this.checked"><span>I understand SMS is simulated on this public preview (no texts sent).</span></label><button class="btn" style="width:100%" onclick="state.phone=$('phone').value.trim();state.smsConsent=$('smsConsent').checked;state.page='plans';render()">Continue →</button><p class="tiny" style="text-align:center;margin-top:17px">Prototype: no account is created and no payment is collected.</p></section>`}
function renderPlans(){$('root').innerHTML=`<div style="max-width:840px;margin:30px auto"><span class="tag">STEP 1 OF 2</span><h1 class="title">Choose your plan</h1><p class="sub">A simple plan for every size of greenhouse.</p><div class="plans">${[['Starter',7,'1 crop type','1 greenhouse unit','1 SMS recipient'],['Pro',29,'Up to 10 crop types','Up to 5 greenhouse units','Up to 6 SMS recipients']].map(p=>`<button type="button" class="plan ${state.plan===p[0]?'selected':''}" onclick="choosePlan('${p[0]}')"><span class="tag">${p[0]==='Pro'?'MOST FLEXIBLE':'GET STARTED'}</span><h2>${p[0]}</h2><div class="price-row"><span class="price">$${p[1]}.00</span><span class="price-period">/ month</span></div><div class="price-detail">Monthly price · Demo plan</div><ul><li>${p[2]}</li><li>${p[3]}</li><li>${p[4]}</li><li>Smart disease-risk alerts</li><li>Inspection and action history</li></ul><span class="btn" style="display:block;text-align:center">Select ${p[0]} →</span></button>`).join('')}</div><p class="tiny mt">Illustrative subscription plans. No payment is taken in this demo.</p></div>`}
function choosePlan(p){state.plan=p;if(p==='Starter')state.units=[{name:'Greenhouse 1',crop:''}];else state.units=[{name:'Greenhouse 1',crop:''},{name:'Greenhouse 2',crop:''}];state.page='setup';state.sensorLinked=false;state.sensorConnecting=false;state.sensorLinkStep=0;render()}
function cropPicker(i){let chosen=state.units[i].crop;return `<div class="field crop-picker"><label for="cropSearch${i}">Choose crop</label><div class="crop-search-wrap"><input id="cropSearch${i}" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cropList${i}" placeholder="Search 30 vegetables, fruits, herbs, flowers…" value="${esc(chosen)}" onfocus="filterCrops(${i})" oninput="filterCrops(${i})" onkeydown="cropSearchKey(event,${i})"></div><div class="crop-list hide" role="listbox" id="cropList${i}"></div>${chosen?`<div class="crop-selected">✓ ${esc(chosen)} selected</div>`:`<div class="crop-hint">Click the search field to browse all crops. Nothing is preselected.</div>`}</div>`}
function filterCrops(i){const input=$('cropSearch'+i),q=input.value.trim().toLowerCase();if(state.units[i].crop!==input.value){state.units[i].crop='';const summary=$('cropSummary'+i);if(summary)summary.textContent='Choose a crop to load its profile.'}document.querySelectorAll('.crop-list').forEach((el,j)=>{if(j!==i)el.classList.add('hide')});let matches=CROP_CATALOG.filter(c=>c[0].toLowerCase().includes(q)||c[1].toLowerCase().includes(q));let list=$('cropList'+i);list.classList.remove('hide');input.setAttribute('aria-expanded','true');list.innerHTML=`<div class="crop-list-head">${matches.length} matching crops · Select an option below</div>`+(matches.map(c=>`<button type="button" role="option" class="crop-option" onclick="setCrop(${i},'${c[0]}')"><span>${esc(c[0])}</span><span class="crop-category">${esc(c[1])}</span></button>`).join('')||'<p style="padding:12px;color:#264b35">No matches. Try another crop name or category.</p>')}
function cropSearchKey(event,i){let list=$('cropList'+i),options=[...list.querySelectorAll('button.crop-option')];if(event.key==='Escape'){list.classList.add('hide');$('cropSearch'+i).setAttribute('aria-expanded','false');return}if(event.key==='ArrowDown'){event.preventDefault();if(list.classList.contains('hide'))filterCrops(i);else if(options.length)options[0].focus()}if(event.key==='Enter'&&!list.classList.contains('hide')){event.preventDefault();if(options.length===1)options[0].click()}}
function setCrop(i,c){state.units[i].crop=c;renderSetup();const next=state.units.findIndex(u=>!u.crop);if(next!==-1){const el=$('cropSearch'+next);if(el)el.focus()}}
function addUnit(){let limit=state.plan==='Pro'?5:1;if(state.units.length>=limit)return toast('Your plan allows up to '+limit+' unit(s).');state.units.push({name:'Greenhouse '+(state.units.length+1),crop:''});state.sensorLinked=false;renderSetup();$('cropSearch'+(state.units.length-1))?.focus()}
function removeUnit(i){if(state.units.length<=1)return;state.units.splice(i,1);state.sensorLinked=false;renderSetup()}
function sensorPanel(){return `<section class="sensor-panel"><div class="row between" style="flex-wrap:wrap;gap:10px"><div><span class="tag">SENSOR CONNECTION</span><h2 style="margin:8px 0 3px;font-size:19px">Connect your greenhouse sensors</h2><div class="smalltext muted">See how a greenhouse climate gateway would pair with CropGuard.</div></div><span class="tag" style="background:${state.sensorLinked?'#e5f6e9':'#f0f3ef'};color:${state.sensorLinked?'#257247':'#65786b'}">${state.sensorLinked?'✓ Demo gateway paired':'Demo gateway · Not paired'}</span></div><div class="sensor-grid">${SENSORS.map(x=>`<div class="sensor-item ${x.active&&state.sensorLinked?'active':''}"><span class="sensor-icon">${x.icon}</span><strong>${esc(x.name)}</strong><span class="sensor-kind">${x.active?(state.sensorLinked?'✓ Virtual feed linked':'Core climate channel'):x.kind}</span></div>`).join('')}</div><div class="sensor-connect"><div style="flex:1;min-width:200px"><strong>${state.sensorLinked?'✓ Climate sensors linked to '+state.units.length+' greenhouse unit(s)':state.sensorConnecting?'Pairing virtual climate gateway…':'Virtual climate gateway'}</strong><div class="tiny">${state.sensorLinked?'Temperature + humidity demo feeds ready.':state.sensorConnecting?['Finding gateway','Identifying greenhouse units','Linking temperature & humidity','Connection ready'][Math.min(state.sensorLinkStep,3)]:'No hardware needed for the pitch demo.'}</div>${state.sensorConnecting?`<div class="sensor-progress"><div class="sensor-progress-fill" style="width:${(state.sensorLinkStep+1)*25}%"></div></div>`:''}</div><button type="button" class="btn ${state.sensorLinked?'secondary':''}" ${state.sensorConnecting?'disabled':''} onclick="connectDemoSensors()">${state.sensorLinked?'↻ Reconnect demo sensors':state.sensorConnecting?'Connecting…':'⚡ Connect demo sensors'}</button></div><p class="sensor-note">Demo simulation only — no physical devices are connected. Temperature and humidity drive the tomato warning replay. CO₂, light/PAR, substrate moisture, EC, pH and leaf wetness are optional sensor types shown for product vision, not active disease inputs.</p></section>`}
function connectDemoSensors(){if(state.sensorConnecting)return;state.sensorLinked=false;state.sensorConnecting=true;state.sensorLinkStep=0;renderSetup();[1,2,3,4].forEach((n)=>setTimeout(()=>{if(state.page!=='setup'||!state.sensorConnecting)return;state.sensorLinkStep=Math.min(n,3);if(n===4){state.sensorConnecting=false;state.sensorLinked=true}renderSetup();},n*470))}
function renderSetup(){$('root').innerHTML=`<div style="max-width:920px;margin:22px auto"><span class="tag">STEP 2 OF 2 · ${state.plan.toUpperCase()}</span><h1 class="title">Set up your greenhouse</h1><p class="sub">Name each unit, search for a crop and optionally pair demo sensors. No crops are preselected.</p><div class="setup-grid">${state.units.map((u,i)=>`<div class="unit"><div class="row between"><strong>Unit ${i+1}</strong>${state.units.length>1?`<button class="btn outline small" onclick="removeUnit(${i})">Remove</button>`:''}</div><div class="field"><label for="unitName${i}">Greenhouse name</label><input id="unitName${i}" value="${esc(u.name)}" oninput="state.units[${i}].name=this.value"></div>${cropPicker(i)}<div class="notice smalltext" id="cropSummary${i}">${u.crop==='Tomato'?'Tomato crop selected · climate monitoring and leaf-mold scouting demo.':u.crop==='Cucumber'?'Cucumber selected · climate overview.':u.crop?'Crop selected · crop-specific disease rules require validation.':'Choose a crop to load its profile.'}</div></div>`).join('')}</div>${sensorPanel()}<div class="row between mt" style="flex-wrap:wrap"><button class="btn secondary" onclick="addUnit()">+ Add greenhouse unit</button><button class="btn" onclick="openDashboard()">Open dashboard →</button></div></div>`}
document.addEventListener('click',event=>{if(!event.target.closest('.crop-picker')){document.querySelectorAll('.crop-list').forEach(el=>el.classList.add('hide'));document.querySelectorAll('[role="combobox"]').forEach(el=>el.setAttribute('aria-expanded','false'))}});
function openDashboard(){const missing=state.units.findIndex(u=>!u.crop);if(missing!==-1){toast('Please choose a crop for each greenhouse from the search dropdown.');$('cropSearch'+missing)?.focus();return}state.page='dashboard';state.active=0;state.stage=0;state.phase='rising';state.run=true;state.startedAt=Date.now();state.contacts=state.phone?[{name:'Owner',phone:state.phone,consented:state.smsConsent}]:[];state.smsStatus='Waiting for high-risk event';render();startTimer();beginDemoSession()}
function startTimer(){clearInterval(ticker);ticker=setInterval(()=>{if(state.page!=='dashboard'||!state.run)return;let now=Date.now();let elapsed=now-state.startedAt;let desired=state.phase==='rising'?Math.min(3,Math.floor(elapsed/4200)):Math.max(0,3-Math.floor(elapsed/2800));if(desired!==state.stage){state.stage=desired;if(state.stage===3&&state.phase==='rising'&&!state.notified){state.notified=true;state.history.unshift({time:new Date().toLocaleTimeString(),type:'Alert',result:'Tomato leaf-mold environmental warning triggered'});toast('High-risk tomato warning generated. Checking SMS delivery…');sendHighRiskAlert();}renderDashboard()}if(state.phase==='recovering'&&desired===0){state.run=false;state.phase='done';renderDashboard()}},300)}
function currentUnit(){return state.units[state.active]||state.units[0]}
function isTomato(){return currentUnit().crop==='Tomato'}
function statusInfo(){if(isTomato())return stages[state.stage];return {t:74,h:70,name:'Monitoring',color:'green',message:'Greenhouse overview is available for this crop.',action:'Review your crop profile and monitor environmental conditions.'}}
function renderDashboard(){if(state.page!=='dashboard')return;let u=currentUnit(),s=statusInfo(),tomato=isTomato();$('root').innerHTML=`<div class="layout"><aside class="sidebar"><div style="width:100%"><div class="tiny" style="font-weight:700;margin-bottom:10px">YOUR GREENHOUSES</div>${state.units.map((x,i)=>`<button class="side-unit ${state.active===i?'active':''}" onclick="state.active=${i};renderDashboard()"><strong>${esc(x.name)}</strong><span class="tiny">${esc(x.crop)}</span></button>`).join('')}<div class="divider"></div><div class="tiny" style="font-weight:700">SENSOR CHANNELS</div><div class="sensor-mini"><span>🌡 Air temp <b>${state.sensorLinked?"✓":"Demo"}</b></span><span>💧 Humidity <b>${state.sensorLinked?"✓":"Demo"}</b></span></div><p class="tiny" style="margin:8px 0 12px">${state.sensorLinked?"Virtual climate gateway paired":"Scripted climate feed"} · 6 optional channels in setup</p><button class="btn secondary small" style="width:100%" onclick="openSms()">✉ SMS alerts & contacts</button><p class="tiny">${state.plan} plan · ${state.contacts.length} recipient(s)</p><p class="tiny" id="smsStatusLabel">SMS: ${esc(state.smsStatus)}</p></div></aside><div class="content"><div class="row between" style="flex-wrap:wrap"><div><div class="tiny">GREENHOUSE OVERVIEW</div><h1 class="title" style="margin-bottom:5px">${esc(u.name)}</h1><div class="muted">${esc(u.crop)} · Simulated sensor replay</div></div><span class="tag">DEMO MODE</span></div><div class="metrics mt"><div class="metric"><div class="tiny">TEMPERATURE</div><div class="value">${s.t}°F</div><div class="tiny">Crop monitoring</div></div><div class="metric"><div class="tiny">RELATIVE HUMIDITY</div><div class="value">${s.h}%</div><div class="tiny">Greenhouse air</div></div></div><div class="status ${s.color}"><div class="row between"><strong>${s.color==='green'?'● ':s.color==='red'?'⚠ ':'◉ '}${s.name}</strong><span class="smalltext">${tomato?'Tomato environment':'Crop overview'}</span></div><div style="margin-top:9px">${s.message}</div><div class="smalltext" style="margin-top:8px"><b>Recommended:</b> ${s.action}</div><div class="progress">${[0,1,2,3].map(i=>`<div class="${i<=state.stage&&tomato?'on':''}"></div>`).join('')}</div><div class="timeline"><span>Optimal</span><span>Watch</span><span>Caution</span><span>High risk</span></div></div>${tomato?`<div class="row between" style="flex-wrap:wrap;margin:12px 0"><div class="tiny">${state.phase==='rising'?'Monitoring automatically · readings update every few seconds':state.phase==='recovering'?'Environmental recovery replay in progress':state.phase==='done'?'Replay complete':'Monitoring paused'}</div><button class="btn outline small" onclick="restartReplay()">↻ Replay from start</button></div>${state.stage===3?inspectionHtml():''}`:`<div class="notice mt"><strong>${esc(u.crop)} greenhouse</strong><p class="smalltext muted">This demo focuses on tomato disease monitoring. Other crops are not assigned unvalidated disease-risk predictions.</p></div>`}<div class="panel mt" style="padding:20px"><div class="row between"><strong>Recent activity</strong><span class="tiny">Inspection & alert history</span></div>${state.history.length?state.history.slice(0,6).map(h=>`<div class="history"><strong>${esc(h.type)} · ${esc(h.time)}</strong><span class="muted">${esc(h.result)}</span></div>`).join(''):'<p class="muted smalltext">No events recorded yet. Monitoring is running.</p>'}</div></div></div>`}
function inspectionHtml(){return `<div class="panel" style="border-color:#e9c5c1"><div class="row between"><strong>Inspect your tomato plants</strong><span class="tag" style="background:#fff0ef;color:#b44540">ACTION NEEDED</span></div><p class="smalltext">Leaf mold is possible under these conditions. Check <b>older leaves, especially their undersides</b>, for olive-green or gray velvety growth. Yellow spots can appear on upper leaf surfaces.</p><div class="divider"></div><strong>Did you find suspicious mold?</strong><div class="choice mt">${['Not checked','No','Yes'].map(v=>`<button class="${state.inspection===v?'active':''}" onclick="chooseInspection('${v}')">${v}</button>`).join('')}</div>${state.inspection==='Yes'?`<div class="field"><label>Where did you notice it?</label><div class="choice">${['Under leaves','Upper leaves','Stems / fruit'].map(v=>`<button class="${state.where===v?'active':''}" onclick="state.where='${v}';renderDashboard()">${v}</button>`).join('')}</div></div><div class="notice"><strong>What to do next</strong><p class="smalltext">${state.where==='Stems / fruit'?'Stem or fruit mold can have different causes, including gray mold. Inspect pruning wounds and avoid moving from suspect plants to healthy ones.':'Leaf mold is one possible cause. Limit unnecessary handling of affected foliage, check nearby plants, and seek diagnostic confirmation.'}</p><p class="smalltext">Reduce prolonged humidity and condensation through appropriate ventilation and airflow. Avoid wetting foliage where possible. Keep temperature within crop- and growth-stage-appropriate targets. Do not apply treatments without an appropriate diagnosis and label guidance.</p></div>`:state.inspection==='No'?`<div class="notice mt smalltext">No visible mold reported. Keep scouting; symptoms can appear later. Improve airflow and reduce prolonged high humidity.</div>`:''}${state.inspection&&state.inspection!=='Not checked'?`<div class="mt"><strong>Follow-up checklist</strong>${['Checked older leaves and neighboring plants','Reviewed ventilation and humidity','Recorded findings'].map(x=>`<label class="checkrow"><input type="checkbox" ${state.checks.includes(x)?'checked':''} onchange="toggleCheck('${x}',this.checked)"><span>${x}</span></label>`).join('')}<button class="btn mt" onclick="saveInspection()">Save checkup & show recovery →</button></div>`:''}</div>`}
function chooseInspection(v){state.inspection=v;state.checks=[];renderDashboard()}
function toggleCheck(v,on){state.checks=on?[...state.checks,v]:state.checks.filter(x=>x!==v)}
function saveInspection(){if(state.inspection==='Not checked'||!state.inspection)return;state.history.unshift({time:new Date().toLocaleTimeString(),type:'Inspection',result:state.inspection==='Yes'?'Suspicious mold reported: '+state.where+'. Follow-up actions recorded.':'No visible mold reported. Follow-up actions recorded.'});state.phase='recovering';state.startedAt=Date.now();state.run=true;state.inspection='';state.checks=[];renderDashboard();toast('Inspection saved. Showing environmental recovery replay — not proof of disease cure.')}
function restartReplay(){state.stage=0;state.phase='rising';state.startedAt=Date.now();state.run=true;state.notified=false;state.inspection='';state.checks=[];state.smsStatus='Waiting for high-risk event';renderDashboard();beginDemoSession()}
function openSms(){state.smsOpen=true;renderSms()}
function closeSms(){state.smsOpen=false;$('portal').innerHTML=''}
function renderSms(){let limit=state.plan==='Pro'?6:1;$('portal').innerHTML=`<div class="overlay" onclick="closeSms()"></div><aside class="drawer"><div class="row between"><h2 style="margin:0">SMS alerts</h2><button class="btn outline small" onclick="closeSms()">✕</button></div><p class="sub">Choose who receives urgent greenhouse warnings.</p><div class="notice smalltext"><strong>${state.plan} plan</strong> · ${state.contacts.length} of ${limit} recipients.<br>SMS mode: <b>${esc(state.smsMode)}</b><br>${esc(state.smsStatus)}<br>This public website is preview-only. No SMS is sent; the private local demo handles Twilio.</div><div class="mt">${state.contacts.map((c,i)=>`<div class="history row between"><div><strong>${esc(c.name)}</strong><span class="muted">${esc(c.phone)} · ${c.consented?'Opted in':'Preview only'}</span></div><button class="btn outline small" onclick="removeContact(${i})">Remove</button></div>`).join('')}</div><div class="field"><label>Contact name</label><input id="contactName" placeholder="e.g. Greenhouse manager"></div><div class="field"><label>Mobile number</label><input id="contactPhone" type="tel" placeholder="+16015550123"></div><label class="checkrow smalltext"><input type="checkbox" id="contactConsent"><span>I confirm this person agreed to receive CropGuard SMS.</span></label><button class="btn" style="width:100%" ${state.contacts.length>=limit?'disabled':''} onclick="addContact()">Add recipient</button><div class="divider"></div>${state.smsMode.includes('trial template')?'<div class="notice smalltext"><b>Free-trial SMS:</b> Twilio sends its own predefined alert text. The disease-specific message below appears only inside CropGuard.</div>':''}<strong>In-app disease alert</strong><div class="notice smalltext mt">CropGuard: ${esc(state.units[0]?.name||'Greenhouse 1')} — Tomato leaf-mold risk. Prolonged high humidity detected. Check older leaf undersides for olive-gray mold. Disease not confirmed.</div><button class="btn secondary mt" onclick="toast('Public demo: no SMS sent. Real SMS works in the private local build.')">Preview notification</button></aside>`}
function addContact(){let limit=state.plan==='Pro'?6:1;if(state.contacts.length>=limit)return;let name=$('contactName').value.trim(),phone=$('contactPhone').value.trim();if(!name||!phone)return toast('Enter a contact name and phone number.');state.contacts.push({name,phone,consented:$('contactConsent').checked});renderSms();toast('Contact saved for next monitoring replay. Only allowlisted, opted-in numbers can receive SMS.')}
function removeContact(i){state.contacts.splice(i,1);renderSms()}
function resetApp(){clearInterval(ticker);state.page='signup';state.stage=0;state.run=false;state.history=[];state.contacts=[];state.phone='';state.smsConsent=false;state.demoSession=null;render()}
render();

// PUBLIC GITHUB PAGES PREVIEW: No backend, no real SMS, no Twilio credentials.
// This preview preserves the full interactive greenhouse walkthrough.
async function beginDemoSession(){
  state.demoSession=null;
  state.smsMode='public website preview (no real SMS)';
  state.smsStatus='Real SMS available only in the privately configured local demo';
  renderDashboard();
}
async function sendHighRiskAlert(){
  if(!state.units.some(u=>u.crop==='Tomato'))return;
  state.smsStatus='Red risk alert displayed — SMS preview only; no text was sent';
  state.history.unshift({time:new Date().toLocaleTimeString(),type:'SMS preview',result:'Would notify opted-in contacts. No real SMS sent from GitHub Pages.'});
  renderDashboard();
}
</script></body></html>
