</style></head><body><div class="app"><header class="top"><div class="brand"><span class="brand-mark" aria-hidden="true">✳</span> <b>MoldGuard</b> <span class="brand-note">grow with confidence</span></div><div class="row"><span class="tiny" id="topLabel">A little more peace of mind for growers</span><button class="btn secondary small hide" id="resetBtn" onclick="resetApp()">Start over</button></div></header><main class="shell" id="root"></main></div><div id="portal"></div><script>
const CROP_CATALOG=[
['Tomato','Vegetable'],['Cucumber','Vegetable'],['Lettuce','Leafy green'],['Bell Pepper','Vegetable'],['Strawberry','Fruit'],['Basil','Herb'],['Spinach','Leafy green'],['Eggplant','Vegetable'],['Zucchini','Vegetable'],['Rose','Flower'],['Petunia','Flower'],['Orchid','Flower'],['Mint','Herb'],['Kale','Leafy green'],['Blueberry','Fruit'],['Raspberry','Fruit'],['Melon','Fruit'],['Green Bean','Vegetable'],['Carrot','Root crop'],['Marigold','Flower'],['Chili Pepper','Vegetable'],['Cilantro','Herb'],['Parsley','Herb'],['Watermelon','Fruit'],['Cabbage','Leafy green'],['Broccoli','Vegetable'],['Geranium','Flower'],['Microgreens','Leafy green'],['Arugula','Leafy green'],['Pea','Vegetable']
];
const CROPS=CROP_CATALOG.map(x=>x[0]);
const SENSORS=[{icon:'🌡',name:'Air temperature',kind:'Used in risk alerts',active:true},{icon:'💧',name:'Relative humidity',kind:'Used in risk alerts',active:true},{icon:'◉',name:'CO₂',kind:'Optional channel',active:false},{icon:'☀',name:'Light / PAR',kind:'Optional channel',active:false},{icon:'🌱',name:'Substrate moisture',kind:'Optional channel',active:false},{icon:'⚡',name:'Substrate EC',kind:'Optional channel',active:false},{icon:'◈',name:'Substrate pH',kind:'Optional channel',active:false},{icon:'☔',name:'Leaf wetness',kind:'Optional channel',active:false}];
const state={page:'signup',phone:'',plan:'Growth',pricing:{crop:'Tomato + Cucumber',units:2,package:'essential',recipients:3,billing:'monthly'},units:[{name:'Tomato House',crop:'Tomato'},{name:'Cucumber House',crop:'Cucumber'}],active:0,inspectUnit:null,inspection:'',where:'Older / lower leaves',checks:[],notes:'',history:[],contacts:[],smsOpen:false,smsConsent:false,smsMode:'public preview',smsStatus:'SMS not connected',run:false,paused:false,returningToDashboard:false,pairedSensors:[],pairUnit:0,unitRuntime:[],demoSession:null,dashboardView:'overview',logFilter:'all',manageIndex:0,accountName:'Greenhouse Owner'};let ticker=null,toastTimer=null;
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages=[{t:72,h:66,name:'Optimal',color:'green',message:'Greenhouse conditions are in the configured monitoring range.',action:'No action needed. Continue routine monitoring.'},{t:73,h:78,name:'Watch',color:'yellow',message:'Humidity is rising toward the upper guidance range.',action:'Check ventilation and keep an eye on humidity.'},{t:73,h:84,name:'Caution',color:'orange',message:'Humidity is approaching a range that may support fungal growth.',action:'Check airflow, reduce condensation and inspect the crop.'},{t:73,h:92,name:'High disease risk',color:'red',message:'Prolonged high humidity can favor tomato leaf mold.',action:'Inspect older tomato leaves, especially the undersides.'}];
function logEvent(type,result,unit){const now=new Date();state.history.unshift({date:now.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}),time:now.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'}),type,result,unit:unit??null});if(state.history.length>200)state.history.length=200;}
function toast(m){$('portal').innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(!state.smsOpen)$('portal').innerHTML=''},3500)}
function render(){if(state.page==='signup')renderSignup();if(state.page==='plans')renderPlans();if(state.page==='setup')renderSetup();if(state.page==='dashboard')renderDashboard();$('resetBtn').classList.toggle('hide',state.page==='signup');$('topLabel').textContent=state.page==='dashboard'?'Greenhouse monitoring':'A little more peace of mind for growers'}
function renderSignup(){$('root').innerHTML=`<section class="panel auth"><span class="tag">A WARM WELCOME</span><h1 class="title">Know your greenhouse. Care for your crops.</h1><p class="sub">See what your crops need, when they need it. Simple readings, timely heads-ups, and a clear next step.</p><div class="field"><label>Mobile number (optional)</label><input id="phone" type="tel" placeholder="+1 (555) 000-0000" value="${esc(state.phone)}"></div><div class="field"><label>Password (not stored)</label><input type="password" placeholder="Create a password"></div><label class="checkrow smalltext"><input type="checkbox" id="smsConsent" ${state.smsConsent?'checked':''} onchange="state.smsConsent=this.checked"><span>I understand this preview does not send text messages.</span></label><button class="btn" style="width:100%" onclick="state.phone=$('phone').value.trim();state.smsConsent=$('smsConsent').checked;state.page='plans';render()">Continue →</button><p class="tiny" style="text-align:center;margin-top:17px">Preview sign-up · No account or payment is created.</p></section>`}
function pricingTotal(){const p=state.pricing;const base=7,extra=(p.units-1)*5,advanced=p.package==='advanced'?4:0,contacts=p.recipients>1?6:0;return {base,extra,advanced,contacts,total:(base+extra+advanced+contacts)*(p.billing==='annual'?.85:1)}}
function updatePricing(k,v){state.pricing[k]=['units','recipients'].includes(k)?Number(v):v;renderPlans()}
function renderPlans(){const p=state.pricing,q=pricingTotal();const tier=p.units===1&&p.recipients===1&&p.package==='essential'?'Starter':p.units<=3?'Growth':'Pro';$('root').innerHTML=`<div style="max-width:1040px;margin:24px auto"><span class="tag">STEP 1 OF 2 · PERSONALIZED PLAN</span><h1 class="title">A plan that fits your growing space</h1><p class="sub">Tell us a little about your setup. We’ll show you what your plan includes and how the estimate is calculated.</p><div class="plans pricing-layout"><div class="panel"><div class="plan-form"><div class="field"><label>1. Which crop?</label><select onchange="updatePricing('crop',this.value)">${['Tomato + Cucumber','Tomato','Cucumber','Mixed crops'].map(v=>`<option ${p.crop===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>2. Greenhouse units?</label><select onchange="updatePricing('units',this.value)">${[1,2,3,4,5,6,8,10].map(n=>`<option value="${n}" ${p.units===n?'selected':''}>${n} unit${n>1?'s':''}</option>`).join('')}</select></div><div class="field"><label>3. Sensor package?</label><select onchange="updatePricing('package',this.value)"><option value="essential" ${p.package==='essential'?'selected':''}>Essential · Temp + Humidity</option><option value="advanced" ${p.package==='advanced'?'selected':''}>Advanced · 8 sensor types</option></select></div><div class="field"><label>4. Alert recipients?</label><select onchange="updatePricing('recipients',this.value)">${[1,3,6].map(n=>`<option value="${n}" ${p.recipients===n?'selected':''}>Up to ${n}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>5. Billing cycle?</label><select onchange="updatePricing('billing',this.value)"><option value="monthly" ${p.billing==='monthly'?'selected':''}>Monthly</option><option value="annual" ${p.billing==='annual'?'selected':''}>Annual · 15% discount</option></select></div></div><button class="btn" style="width:100%;margin-top:15px" onclick="choosePlan('${tier}')">Continue with ${tier} →</button></div><div class="quote-box"><span class="tag">YOUR ESTIMATED PLAN</span><h2 style="margin:14px 0 0">${tier}</h2><div class="price-row"><span class="price">$${Number(q.total.toFixed(2))}</span><span class="price-period" style="color:#c3dcca">/ month</span></div><div class="tiny">${p.units} greenhouse unit(s) · ${esc(p.crop)}${p.billing==='annual'?' · billed annually':''}</div><div class="divider" style="background:#416a53"></div><div class="quote-line"><span>First unit</span><strong>$7</strong></div><div class="quote-line"><span>${p.units-1} additional unit(s)</span><strong>$${q.extra}</strong></div><div class="quote-line"><span>Advanced sensors</span><strong>${q.advanced?'$4':'Included'}</strong></div><div class="quote-line"><span>Extra alert recipients</span><strong>${q.contacts?'$6':'Included'}</strong></div>${p.billing==='annual'?'<div class="quote-line"><span>Annual discount</span><strong>−15%</strong></div>':''}<p class="tiny" style="margin-top:20px">Estimated pricing only · No checkout or charge.</p></div></div></div>`}
function choosePlan(p){state.plan=p;const n=state.pricing.units;state.units=Array.from({length:n},(_,i)=>({name:i===0&&state.pricing.crop.includes('Tomato')?'Tomato House':i===1&&state.pricing.crop.includes('Cucumber')?'Cucumber House':'Greenhouse '+(i+1),crop:state.pricing.crop==='Tomato'?'Tomato':state.pricing.crop==='Cucumber'?'Cucumber':state.pricing.crop==='Tomato + Cucumber'?(i%2===0?'Tomato':'Cucumber'):''}));state.pairedSensors=state.units.map(()=>new Set());state.pairUnit=0;state.page='setup';render()}
function cropPicker(i){let chosen=state.units[i].crop;return `<div class="field crop-picker"><label for="cropSearch${i}">Choose crop</label><div class="crop-search-wrap"><input id="cropSearch${i}" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cropList${i}" placeholder="Search 30 vegetables, fruits, herbs, flowers…" value="${esc(chosen)}" onfocus="filterCrops(${i})" oninput="filterCrops(${i})" onkeydown="cropSearchKey(event,${i})"></div><div class="crop-list hide" role="listbox" id="cropList${i}"></div>${chosen?`<div class="crop-selected">✓ ${esc(chosen)} selected</div>`:`<div class="crop-hint">Click the search field to browse all crops. Nothing is preselected.</div>`}</div>`}
function filterCrops(i){const input=$('cropSearch'+i),q=input.value.trim().toLowerCase();if(state.units[i].crop!==input.value){state.units[i].crop='';const summary=$('cropSummary'+i);if(summary)summary.textContent='Choose a crop to load its profile.'}document.querySelectorAll('.crop-list').forEach((el,j)=>{if(j!==i)el.classList.add('hide')});let matches=CROP_CATALOG.filter(c=>c[0].toLowerCase().includes(q)||c[1].toLowerCase().includes(q));let list=$('cropList'+i);list.classList.remove('hide');input.setAttribute('aria-expanded','true');list.innerHTML=`<div class="crop-list-head">${matches.length} matching crops · Select an option below</div>`+(matches.map(c=>`<button type="button" role="option" class="crop-option" onclick="setCrop(${i},'${c[0]}')"><span>${esc(c[0])}</span><span class="crop-category">${esc(c[1])}</span></button>`).join('')||'<p style="padding:12px;color:#264b35">No matches. Try another crop name or category.</p>')}
function cropSearchKey(event,i){let list=$('cropList'+i),options=[...list.querySelectorAll('button.crop-option')];if(event.key==='Escape'){list.classList.add('hide');$('cropSearch'+i).setAttribute('aria-expanded','false');return}if(event.key==='ArrowDown'){event.preventDefault();if(list.classList.contains('hide'))filterCrops(i);else if(options.length)options[0].focus()}if(event.key==='Enter'&&!list.classList.contains('hide')){event.preventDefault();if(options.length===1)options[0].click()}}
function setCrop(i,c){state.units[i].crop=c;renderSetup();const next=state.units.findIndex(u=>!u.crop);if(next!==-1){const el=$('cropSearch'+next);if(el)el.focus()}}
function addUnit(){if(state.units.length>=10)return toast('Maximum 10 greenhouse units.');state.units.push({name:'Greenhouse '+(state.units.length+1),crop:''});state.pairedSensors.push(new Set());state.pricing.units=state.units.length;renderSetup()}
function removeUnit(i){if(state.units.length<=1)return;state.units.splice(i,1);state.pairedSensors.splice(i,1);state.pairUnit=Math.min(state.pairUnit,state.units.length-1);state.pricing.units=state.units.length;renderSetup()}
function sensorPanel(){const i=state.pairUnit,paired=state.pairedSensors[i]||new Set();return `<section class="sensor-panel"><div class="row between" style="gap:12px;flex-wrap:wrap"><div><span class="tag">ᛒ SENSOR PAIRING</span><h2 style="margin:8px 0 3px;font-size:20px">Pair sensors one by one</h2><div class="smalltext muted">Choose the sensors you want to see on your greenhouse dashboard.</div></div><div class="field" style="margin:0;min-width:180px"><label>Select greenhouse</label><select onchange="state.pairUnit=Number(this.value);renderSetup()">${state.units.map((u,j)=>`<option value="${j}" ${i===j?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div></div><div class="notice mt">ᛒ ${SENSORS.length} devices available · ${paired.size} paired to ${esc(state.units[i]?.name||'Unit')}</div><div class="device-grid">${SENSORS.map((d,j)=>`<div class="device-row"><div><strong>${d.icon} ${esc(d.name)}</strong><small>CG-${String(j+1).padStart(2,'0')} · ${paired.has(j)?'✓ Paired':'Available'}</small></div><button type="button" class="btn ${paired.has(j)?'secondary':''} small" onclick="toggleSensor(${i},${j})">${paired.has(j)?'Disconnect':'Connect'}</button></div>`).join('')}</div><p class="sensor-note">Pairing preview only — no physical Bluetooth device is connected. Temperature and humidity drive the sample risk sequence.</p></section>`}
function toggleSensor(i,j){if(!state.pairedSensors[i])state.pairedSensors[i]=new Set();const set=state.pairedSensors[i];if(set.has(j))set.delete(j);else set.add(j);logEvent('Sensor',state.units[i].name+': '+SENSORS[j].name+(set.has(j)?' connected':' disconnected')+' (pairing preview).',i);renderSetup();toast(SENSORS[j].name+(set.has(j)?' connected':' disconnected')+' (preview)')}
function connectDemoSensors(){toast('Select Connect beside each sensor to preview pairing.');}
function renderSetup(){$('root').innerHTML=`<div style="max-width:1030px;margin:20px auto"><span class="tag">STEP 2 OF 2 · ${esc(state.plan.toUpperCase())} PLAN</span><h1 class="title">Let’s set up your growing space</h1><p class="sub">Give each greenhouse a name, choose what you grow, and pair only the sensors you use.</p><div class="setup-grid">${state.units.map((u,i)=>`<div class="unit"><div class="row between"><strong>Unit ${i+1}</strong>${state.units.length>1?`<button class="btn outline small" onclick="removeUnit(${i})">Remove</button>`:''}</div><div class="field"><label>Greenhouse name</label><input value="${esc(u.name)}" oninput="state.units[${i}].name=this.value"></div>${cropPicker(i)}<div class="notice smalltext" id="cropSummary${i}">${u.crop==='Tomato'?'🍅 Tomato · Leaf mold risk guidance':u.crop==='Cucumber'?'🥒 Cucumber · Downy mildew risk guidance':u.crop?'Crop selected · Climate overview only':'Choose a crop to continue.'}</div></div>`).join('')}</div>${sensorPanel()}<div class="row between mt" style="flex-wrap:wrap"><button class="btn secondary" onclick="addUnit()">+ Add unit</button><button class="btn" onclick="goToDashboard()">${state.returningToDashboard?'Back to dashboard →':'Open dashboard →'}</button></div></div>`}
document.addEventListener('click',event=>{if(!event.target.closest('.crop-picker')){document.querySelectorAll('.crop-list').forEach(el=>el.classList.add('hide'));document.querySelectorAll('[role="combobox"]').forEach(el=>el.setAttribute('aria-expanded','false'))}});
function goToDashboard(){if(state.returningToDashboard){state.page='dashboard';state.returningToDashboard=false;state.unitRuntime.forEach(r=>{if(r.started&&!r.resolved&&(r.recovering||r.stage<3))r.nextAt=Date.now()+(r.recovering?3500:4300)});renderDashboard();return;}openDashboard()}
function createUnitRuntime(){return {stage:0,started:false,recovering:false,resolved:false,nextAt:Date.now()+4200,notified:false}}
function openDashboard(){const missing=state.units.findIndex(u=>!u.crop);if(missing!==-1){toast('Choose a crop for every greenhouse first.');$('cropSearch'+missing)?.focus();return;}state.page='dashboard';state.active=0;state.inspectUnit=null;state.unitRuntime=state.units.map(()=>createUnitRuntime());const firstTomato=state.units.findIndex(u=>u.crop==='Tomato');state.unitRuntime[firstTomato>=0?firstTomato:0].started=true;state.run=true;state.paused=false;state.contacts=state.phone?[{name:'Owner',phone:state.phone,consented:state.smsConsent}]:[];state.smsStatus='Waiting for high-risk event';state.dashboardView='overview';logEvent('Monitoring','Monitoring sequence started for '+state.units.length+' greenhouse unit(s).');render();startTimer();beginDemoSession()}
function startTimer(){clearInterval(ticker);ticker=setInterval(()=>{if(state.page!=='dashboard'||!state.run||state.paused)return;const now=Date.now();let changed=false;state.unitRuntime.forEach((r,i)=>{if(!r.started||now<r.nextAt)return;if(r.resolved)return;if(r.recovering){if(r.stage>0){r.stage--;changed=true;}if(r.stage===0){r.recovering=false;r.resolved=true;changed=true;logEvent('Recovery',state.units[i].name+' returned to GREEN / SAFE. Risk remains stable until manual Replay.',i);}else{logEvent('Recovery',state.units[i].name+' recovered to '+['Stable','Watch','Caution','High risk'][r.stage]+' (risk index '+unitInfo(i).score+').',i);}r.nextAt=now+3500;}else if(r.stage<3){r.stage++;changed=true;r.nextAt=now+4300;logEvent('Monitoring',state.units[i].name+' changed to '+['Stable','Watch','Caution','High risk'][r.stage]+' · Risk level '+unitInfo(i).score+' · Temperature '+unitInfo(i).t+'°C · Humidity '+unitInfo(i).h+'% (sample data).',i);if(r.stage===3&&!r.notified){r.notified=true;const crop=state.units[i].crop;logEvent('Risk alert',state.units[i].name+' · '+crop+' environmental risk is high (risk index '+unitInfo(i).score+'). Inspection needed.',i);sendHighRiskAlert(i);}}});const lead=state.unitRuntime.findIndex((r,i)=>r.started&&r.stage>=2&&state.units[i].crop==='Tomato');if(lead!==-1){state.unitRuntime.forEach((r,i)=>{if(i!==lead&&!r.started){r.started=true;r.nextAt=now+4300;changed=true;logEvent('Monitoring',state.units[i].name+' monitoring started after Tomato reached Caution.',i);}})}if(changed)renderDashboard();},300)}
function togglePause(){state.paused=!state.paused;if(!state.paused)state.unitRuntime.forEach(r=>{if(r.resolved)return;if(r.started&&!r.recovering&&r.stage<3)r.nextAt=Date.now()+4300;else if(r.recovering)r.nextAt=Date.now()+3500});renderDashboard()}
function currentUnit(){return state.units[state.active]||state.units[0]}
function isTomato(){return currentUnit().crop==='Tomato'}
function unitInfo(i){const u=state.units[i],r=state.unitRuntime[i],n=r.stage,tc=u.crop==='Tomato',cc=u.crop==='Cucumber';const t=(tc?[24.2,25.1,25.8,26.1]:cc?[23.5,23.3,22.8,22.2]:[23.7,24.1,24.8,25.2])[n];const h=(tc?[62,76,87,94]:cc?[67,79,89,96]:[64,77,86,93])[n];return {t,h,wet:['Low','Moderate','Elevated','High'][n],light:(tc?[420,407,396,389]:[390,382,374,365])[n],soil:[43,42,40,39][n],ec:[1.8,1.9,2.0,2.1][n],ph:[6.3,6.3,6.2,6.2][n],co2:[620,650,680,710][n],score:(tc?[12,41,72,94]:cc?[10,43,74,95]:[11,40,70,92])[n],color:['green','yellow','orange','red'][n],label:['STABLE','WATCH','CAUTION','HIGH RISK'][n]}}
function statusInfo(){return unitInfo(state.active)}
function sensorReading(i,j){const v=unitInfo(i);return [{value:v.t.toFixed(1)+'°C',label:'Temperature'},{value:v.h+'%',label:'Humidity'},{value:v.co2+' ppm',label:'CO₂'},{value:v.light+'',label:'Light / PAR'},{value:v.soil+'%',label:'Soil moisture'},{value:v.ec.toFixed(1)+' mS/cm',label:'Substrate EC'},{value:v.ph.toFixed(1),label:'Substrate pH'},{value:v.wet,label:'Leaf wetness'}][j]}
function sensorReadingHtml(i){const paired=state.pairedSensors[i]||new Set();if(!paired.size)return '<div class="live-empty">ᛒ No sensors connected yet. Pair a sensor to see its readings here.</div>';return [...paired].sort((a,b)=>a-b).map(j=>{const v=sensorReading(i,j);return `<div class="live-reading"><small>${SENSORS[j].icon} ${esc(v.label)}</small><b>${esc(v.value)}</b></div>`}).join('')}
function cropEmoji(c){return c==='Tomato'?'🍅':c==='Cucumber'?'🥒':'🌿'}
function nextStepFor(i){
 const r=state.unitRuntime[i];
 if(r.resolved)return ['All set for now','You completed the checkup. This crop will stay stable until you choose Replay.'];
 if(r.recovering)return ['Good work — recovery underway','You logged your actions. Watch this crop move back toward stable conditions.'];
 if(!r.started)return ['Looking good','Conditions are steady. Keep up your regular greenhouse checks.'];
 if(r.stage===3)return ['A closer look is needed','Inspect the leaves, note what you see, and record the preventive steps you take.'];
 if(r.stage===2)return ['Time for a quick check','Look for condensation, check airflow, and inspect the leaves before conditions worsen.'];
 if(r.stage===1)return ['Worth keeping an eye on','Humidity is increasing. Check ventilation and keep monitoring.'];
 return ['Looking good','Conditions are steady. Keep up your regular greenhouse checks.'];
}
function dashboardFocusHtml(){
 const urgent=state.unitRuntime.findIndex(r=>r.stage>=2&&!r.recovering&&!r.resolved);
 if(urgent>=0){const u=state.units[urgent],isRed=state.unitRuntime[urgent].stage===3;

function renderDashboard(){if(state.page!=='dashboard')return;const red=state.unitRuntime.filter(r=>r.stage===3).length;const paired=state.pairedSensors.reduce((n,x)=>n+x.size,0);$('root').innerHTML=`<div class="dashboard-head"><div><span class="tag">GREENHOUSE OVERVIEW</span><h1 class="title">Your greenhouse, at a glance</h1><div class="muted">See what’s doing well, what needs a closer look, and what to do next.</div></div><div class="row"><button class="btn outline small" onclick="togglePause()">${state.paused?'▶ Resume':'Ⅱ Pause'}</button><button class="btn secondary small" onclick="restartReplay()">↻ Replay</button></div></div><div class="dashboard-stats"><div class="dashboard-stat"><span class="tiny">Greenhouses</span><b>${state.units.length}</b></div><div class="dashboard-stat"><span class="tiny">Paired sensors</span><b>${paired}</b></div><div class="dashboard-stat"><span class="tiny">Need attention</span><b>${red}</b></div><div class="dashboard-stat"><span class="tiny">Checkups recorded</span><b>${state.history.filter(x=>x.type==='Inspection').length}</b></div></div>${dashboardFocusHtml()}${statusGuideHtml()}<div class="live-grid">${state.units.map((u,i)=>{const r=state.unitRuntime[i],v=unitInfo(i);const desc=r.resolved?'All clear — checkup complete':r.recovering?'✓ Action recorded · Environmental recovery':!r.started?'Environment stable':r.stage===3?'High risk. A checkup is needed.':['Environment stable','Humidity is climbing','Conditions may favor mold'][r.stage];return `<article class="live-unit ${v.color}"><div class="live-unit-head"><div class="live-unit-name"><span class="crop-emoji">${cropEmoji(u.crop)}</span><div><strong>${esc(u.name)}</strong><small>Unit GH-${String(i+1).padStart(2,'0')} · ${esc(u.crop)}</small></div></div><span class="risk-state ${v.color}">${v.label}</span></div><div class="risk-outer"><button class="risk-ring-button" aria-label="Inspect ${esc(u.name)}" onclick="openInspection(${i})"><div class="risk-ring ${v.color}"><span class="risk-score">${v.score}</span><small>Risk level</small><span class="risk-exclaim" ${r.stage<2?'hidden':''}>!</span></div></button><div class="risk-note">${desc}</div></div><strong style="font-size:13px">Readings from selected sensors</strong><div class="live-readings">${sensorReadingHtml(i)}</div><div class="human-next"><span>WHAT TO KNOW</span><strong>${esc(nextStepFor(i)[0])}</strong><p>${esc(nextStepFor(i)[1])}</p></div><div class="live-foot"><span class="tiny">${r.stage===3&&!r.recovering?'🔒 Holds until checkup':r.recovering?'↘ Recovering after action':r.resolved?'✓ Checkup complete · Stable':r.started?'● Monitoring':'✓ Stable'}</span><button class="btn secondary small" onclick="openInspection(${i})">Open checkup →</button></div></article>`}).join('')}</div>${state.inspectUnit!==null?inspectionHtml():''}<div class="panel mt"><div class="row between" style="flex-wrap:wrap;gap:10px"><div><strong>Your connections and notifications</strong><p class="tiny" style="margin:4px 0">Choose which sensor channels appear above, and review your alert contacts.</p></div><div class="row"><button class="btn secondary small" onclick="openSensorDashboard()">ᛒ Manage sensors</button><button class="btn outline small" onclick="openSms()">✉ SMS preview</button></div></div></div><p class="tiny mt" role="note">Sensor readings and risk indicators are illustrative. No live hardware or SMS is connected. Risk alerts are not diagnoses.</p>`;mountWorkspace()}

 if(state.units.length>=10)return toast('Maximum 10 greenhouses.');

"tiny mt">Changing a crop resets that unit to Green / Stable. Replay starts a new risk sequence. Crop-specific risk guidance is available for Tomato and Cucumber.</p>`;
